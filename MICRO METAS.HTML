ow);backdrop-filter:blur(16px)}.mobile-nav .nav-btn{font-size:11px}.mobile-add{width:45px;height:45px;border:0;border-radius:14px;background:var(--green-strong);color:#fff;font-size:22px}.goal-form{grid-template-columns:1fr}.form-main{padding:20px 16px}.form-grid.two,.form-grid.three{grid-template-columns:1fr}.realism{border-left:0;border-top:1px solid var(--line-soft)}.modal-foot{padding:13px 16px;flex-wrap:wrap}.modal-foot .danger{width:100%}.toast{left:15px;right:15px;bottom:88px;max-width:none}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}

<body>
  <header class="topbar">
    <button class="brand" data-view="panel" aria-label="Ir al panel"><span class="brand-dot"></span>MI RUTA</button>
    <nav class="desktop-nav" aria-label="Navegación principal">
      <button class="nav-btn active" data-view="panel">Panel</button>
      <button class="nav-btn" data-view="goals">Metas</button>
      <button class="nav-btn" data-view="review">Revisión</button>
    </nav>
    <div class="header-actions">
      <button class="icon-btn" id="themeButton" aria-label="Cambiar tema">◐</button>
      <button class="btn primary" data-action="new">＋ Nueva meta</button>
    </div>
  </header>

  <main id="app"></main>

  <nav class="mobile-nav" aria-label="Navegación móvil">
    <button class="nav-btn active" data-view="panel">Panel</button>
    <button class="nav-btn" data-view="goals">Metas</button>
    <button class="mobile-add" data-action="new" aria-label="Nueva meta">＋</button>
    <button class="nav-btn" data-view="review">Revisión</button>
  </nav>

  <dialog id="goalDialog" aria-labelledby="dialogTitle">
    <div class="modal-head"><div><span class="eyebrow">Diseña una ruta posible</span><h2 id="dialogTitle">Nueva meta</h2></div><button class="close" type="button" data-action="close">×</button></div>
    <form class="goal-form" id="goalForm">
      <div class="form-main">
        <label class="field"><span>¿Qué quieres lograr?</span><input id="fTitle" placeholder="Ejemplo: Leer 50 páginas esta semana" required></label>
        <div class="form-grid two">
          <label class="field"><span>Horizonte</span><select id="fHorizon"><option value="weekly">Semanal</option><option value="monthly">Mensual</option><option value="short">Corto plazo</option><option value="long">Largo plazo</option></select></label>
          <label class="field"><span>Área de vida</span><select id="fCategory"><option>Personal</option><option>Salud</option><option>Estudio</option><option>Trabajo</option><option>Finanzas</option><option>Espiritual</option><option>Familia</option><option>Otro</option></select></label>
        </div>
        <div class="form-grid two">
          <label class="field"><span>Fecha de inicio</span><input type="date" id="fStart" required></label>
          <label class="field"><span>Fecha límite</span><input type="date" id="fDue" required></label>
        </div>
        <div class="form-grid three">
          <label class="field"><span>Avance actual</span><input type="number" id="fCurrent" min="0" step="any" value="0"></label>
          <label class="field"><span>Meta numérica</span><input type="number" id="fTarget" min="0.01" step="any" value="1" required></label>
          <label class="field"><span>Unidad</span><input id="fUnit" value="veces" placeholder="páginas, COP, veces…" required></label>
        </div>
        <div class="form-grid two">
          <label class="field"><span>Horas que requiere por semana</span><input type="number" id="fHours" min="0.5" step="0.5" value="1"></label>
          <label class="field"><span>Horas que realmente tienes</span><input type="number" id="fAvailable" min="0.5" step="0.5" value="3"></label>
        </div>
        <label class="field"><span>¿Por qué es importante para ti?</span><textarea id="fWhy" rows="3" placeholder="Conecta la meta con una razón personal…" required></textarea></label>
        <label class="field"><span>¿Cuál es la siguiente acción concreta?</span><input id="fAction" placeholder="Una acción pequeña que puedas iniciar" required></label>
      </div>
      <aside class="realism">
        <div class="score-ring" id="scoreRing"><div><strong id="scoreValue">50%</strong><span>realista</span></div></div>
        <h3 id="scoreTitle">Todavía puede mejorar</h3><p>Una buena meta es específica, medible y cabe en tu vida real.</p>
        <ul id="checkList"></ul><div class="warning" id="warning" hidden><strong>Ajuste recomendado</strong>La meta requiere más tiempo del disponible. Reduce el alcance o amplía el plazo.</div>
      </aside>
      <div class="modal-foot"><button class="btn danger" id="deleteButton" type="button" hidden>Eliminar</button><button class="btn secondary" type="button" data-action="close">Cancelar</button><button class="btn primary" type="submit" id="saveButton">Crear meta</button></div>
    </form>
  </dialog>

  <input class="sr-only" type="file" id="importInput" accept="application/json">
  <div class="toast" id="toast" role="status"><i>✓</i><span></span></div>

  <script>
    (() => {
      'use strict';
      const KEY='mi-ruta-html-v1';
      const horizons=[['weekly','Semanales'],['monthly','Mensuales'],['short','Corto plazo'],['long','Largo plazo']];
      const symbols={Personal:'✦',Salud:'+',Estudio:'A',Trabajo:'▣',Finanzas:'$',Espiritual:'◌',Familia:'♥',Otro:'•'};
      const $=id=>document.getElementById(id);
      const app=$('app'),dialog=$('goalDialog');
      const isoOffset=days=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)};
      const nowISO=()=>new Date().toISOString();
      const id=()=>self.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(16).slice(2);
      const clamp=(v,min,max)=>Math.min(Math.max(v,min),max);
      const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
      const fmtDate=v=>new Intl.DateTimeFormat('es-CO',{day:'numeric',month:'short'}).format(new Date(v+'T12:00:00'));
      const fmtFull=v=>new Intl.DateTimeFormat('es-CO',{dateStyle:'medium'}).format(new Date(v));
      const fmtNum=v=>new Intl.NumberFormat('es-CO',{maximumFractionDigits:1}).format(v);
      const daysBetween=(a,b)=>Math.ceil((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);
      const progress=g=>g.target>0?Math.round(clamp(g.current/g.target*100,0,100)):0;
      const atRisk=g=>{if(g.status!=='active')return false;const total=Math.max(daysBetween(g.startDate,g.dueDate),1),elapsed=clamp(daysBetween(g.startDate,isoOffset(0)),0,total),expected=Math.round(elapsed/total*100);return daysBetween(isoOffset(0),g.dueDate)<0||progress(g)+20<expected};
      const samples=()=>{const n=nowISO();return [
        {id:'example-reading',title:'Leer 50 páginas esta semana',category:'Estudio',horizon:'weekly',startDate:isoOffset(-2),dueDate:isoOffset(5),current:30,target:50,unit:'páginas',why:'Quiero fortalecer mi disciplina y aprender algo útil cada día.',nextAction:'Leer 10 páginas después del desayuno',weeklyHours:2,availableHours:4,status:'active',createdAt:n,updatedAt:n},
        {id:'example-programming',title:'Completar el módulo de JavaScript',category:'Estudio',horizon:'monthly',startDate:isoOffset(-8),dueDate:isoOffset(22),current:6,target:12,unit:'lecciones',why:'Quiero mejorar mis fundamentos para construir proyectos con seguridad.',nextAction:'Resolver la lección de funciones y sus ejercicios',weeklyHours:4,availableHours:6,status:'active',createdAt:n,updatedAt:n},
        {id:'example-savings',title:'Crear un fondo para una meta financiera',category:'Finanzas',horizon:'long',startDate:isoOffset(-30),dueDate:isoOffset(240),current:450000,target:3000000,unit:'COP',why:'Quiero tener más tranquilidad y avanzar sin depender de imprevistos.',nextAction:'Programar el próximo aporte mensual',weeklyHours:1,availableHours:2,status:'active',createdAt:n,updatedAt:n}
      ]};
      let state={goals:samples(),checkins:[],reviews:[],theme:'light',view:'panel',horizon:'weekly',search:'',status:'all',editing:null,rating:4};
      try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.goals))state={...state,...saved,view:'panel',editing:null}}catch(e){}
      document.documentElement.dataset.theme=state.theme;
      const persist=()=>localStorage.setItem(KEY,JSON.stringify({goals:state.goals,checkins:state.checkins,reviews:state.reviews,theme:state.theme,horizon:state.horizon}));
      let toastTimer;
      const toast=message=>{clearTimeout(toastTimer);$('toast').querySelector('span').textContent=message;$('toast').classList.add('show');toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2800)};
      const metrics=()=>({active:state.goals.filter(g=>g.status==='active').length,completed:state.goals.filter(g=>g.status==='completed').length,risk:state.goals.filter(atRisk).length,overall:state.goals.length?Math.round(state.goals.reduce((s,g)=>s+progress(g),0)/state.goals.length):0});
      const streak=()=>{const dates=new Set(state.checkins.map(c=>c.date.slice(0,10)));let n=0,d=new Date();d.setHours(12,0,0,0);if(!dates.has(d.toISOString().slice(0,10)))d.setDate(d.getDate()-1);while(dates.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n};
      const nav=()=>document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));
      function horizonTabs(){return `<div class="horizon-tabs" role="tablist">${horizons.map(([key,label])=>`<button class="${state.horizon===key?'active':''}" data-horizon="${key}" role="tab" aria-selected="${state.horizon===key}"><span>${label}</span><small>${state.goals.filter(g=>g.horizon===key).length}</small></button>`).join('')}</div>`}
      function goalCard(g){const p=progress(g),risk=atRisk(g),left=daysBetween(isoOffset(0),g.dueDate),label=g.status==='completed'?'Cumplida':g.status==='paused'?'En pausa':risk?'En riesgo':'En curso';return `<article class="goal-card ${g.status} ${risk?'risk':''}">
        <div class="goal-top"><span class="cat-icon">${symbols[g.category]||'•'}</span><div class="goal-title"><div class="goal-meta"><b>${esc(g.category)}</b><span>•</span><time>${fmtDate(g.dueDate)}</time></div><h3>${esc(g.title)}</h3></div><button class="more" data-action="edit" data-id="${esc(g.id)}" aria-label="Editar ${esc(g.title)}">•••</button></div>
        <div class="progress-row"><strong>${p}%</strong><span>${fmtNum(g.current)} de ${fmtNum(g.target)} ${esc(g.unit)}</span><em class="status ${risk?'risk':''}">${label}</em></div><div class="track"><span style="width:${p}%"></span></div>
        <div class="next"><span>Siguiente acción</span><strong>${esc(g.nextAction)}</strong></div><div class="goal-footer"><span class="deadline ${left<0?'late':''}">${left<0?Math.abs(left)+' días de retraso':left===0?'Vence hoy':left+' días restantes'}</span><div class="progress-actions">${g.status!=='completed'?`<button class="pause" data-action="pause" data-id="${esc(g.id)}">${g.status==='paused'?'Reanudar':'Pausar'}</button>`:''}<button data-action="minus" data-id="${esc(g.id)}" ${g.current<=0?'disabled':''}>−</button><button data-action="plus" data-id="${esc(g.id)}" ${g.status==='completed'?'disabled':''}>＋</button><button class="complete" data-action="complete" data-id="${esc(g.id)}" ${g.status==='completed'?'disabled':''}>✓</button></div></div></article>`}
      const empty=filtered=>`<section class="empty"><span>◎</span><h3>${filtered?'No encontramos coincidencias':'Este horizonte está listo para una meta'}</h3><p>${filtered?'Prueba otro texto o cambia el estado seleccionado.':'Empieza por algo concreto, medible y suficientemente pequeño para avanzar.'}</p>${filtered?'':'<button class="btn primary" data-action="new">Crear mi primera meta</button>'}</section>`;
      function renderPanel(){const m=metrics(),items=state.goals.filter(g=>g.horizon===state.horizon),label=horizons.find(h=>h[0]===state.horizon)[1];app.innerHTML=`<div class="page"><section class="hero"><div><span class="eyebrow">Tu sistema personal de avance</span><h1>Convierte intención<br>en progreso real</h1><p>Define metas realistas, avanza con claridad y revisa lo que realmente importa.</p><button class="text-action" data-action="new">Crear una meta con propósito <span>→</span></button></div><div class="orbit" style="--p:${m.overall*3.6}deg"><div><strong>${m.overall}<small>%</small></strong><span>Progreso general</span></div></div></section>
        <section class="metrics"><article class="metric"><span class="metric-icon">◎</span><div><span>Activas</span><strong>${m.active}</strong></div></article><article class="metric"><span class="metric-icon">✓</span><div><span>Completadas</span><strong>${m.completed}</strong></div></article><article class="metric gold"><span class="metric-icon">♨</span><div><span>Racha</span><strong>${streak()} días</strong></div></article><article class="metric terra"><span class="metric-icon">!</span><div><span>En riesgo</span><strong>${m.risk}</strong></div></article></section>${horizonTabs()}
        <section class="section-head"><div><span class="eyebrow">Enfoque actual</span><h2>${label}</h2></div><button class="btn secondary" data-action="new">＋ Agregar</button></section>${items.length?`<div class="goal-grid">${items.slice(0,4).map(goalCard).join('')}</div>`:empty(false)}
        <section class="reflection"><div class="index">01</div><div><span class="eyebrow">Pregunta de enfoque</span><h2>¿Qué acción pequeña haría que hoy valiera la pena?</h2></div><button class="round" data-view="review">↗</button></section></div>`}
      function renderGoals(){const filtered=state.goals.filter(g=>{const q=(g.title+' '+g.category).toLowerCase().includes(state.search.toLowerCase());const s=state.status==='all'||(state.status==='risk'?atRisk(g):g.status===state.status);return q&&s});app.innerHTML=`<div class="page"><section class="page-title"><div><span class="eyebrow">Tu mapa completo</span><h1>Todas tus metas</h1><p>Prioriza, ajusta y registra avances sin perder de vista el propósito.</p></div><button class="btn primary" data-action="new">＋ Nueva meta</button></section><section class="toolbar"><label class="search"><span>⌕</span><input id="searchInput" value="${esc(state.search)}" placeholder="Buscar por nombre o categoría"></label><select id="statusFilter" aria-label="Filtrar por estado"><option value="all">Todos los estados</option><option value="active">Activas</option><option value="completed">Completadas</option><option value="paused">En pausa</option><option value="risk">En riesgo</option></select><button class="btn secondary" data-action="export">↓ Respaldar</button><label class="btn secondary file">↑ Restaurar<input type="button" data-action="import"></label></section>${filtered.length?`<div class="goal-grid">${filtered.map(goalCard).join('')}</div>`:empty(state.goals.length>0)}</div>`;$('statusFilter').value=state.status}
      function renderReview(){const m=metrics(),recent=state.checkins.filter(c=>daysBetween(c.date.slice(0,10),isoOffset(0))<=7);app.innerHTML=`<div class="page"><section class="page-title"><div><span class="eyebrow">Cierra el ciclo</span><h1>Revisión semanal</h1><p>Aprende de lo que pasó y decide con qué vas a comprometerte después.</p></div><div class="review-date"><span>Semana actual</span><strong>${fmtDate(isoOffset(-6))} — ${fmtDate(isoOffset(0))}</strong></div></section><section class="review-summary"><div><strong>${recent.length}</strong><span>avances registrados</span></div><div><strong>${m.completed}</strong><span>metas cumplidas</span></div><div><strong>${m.risk}</strong><span>necesitan atención</span></div><div><strong>${m.overall}%</strong><span>progreso general</span></div></section>
        <div class="review-layout"><form class="review-form" id="reviewForm"><div class="card-heading"><span class="step">01</span><div><h2>Haz una pausa consciente</h2><p>No necesitas una semana perfecta; necesitas una semana que te enseñe algo.</p></div></div><label class="field"><span>¿Qué salió bien?</span><textarea id="rWins" rows="3" placeholder="Ejemplo: estudié tres días aunque llegué cansado…" required></textarea></label><label class="field"><span>¿Qué te bloqueó?</span><textarea id="rBlocks" rows="3" placeholder="Sin culpa: identifica el obstáculo real…"></textarea></label><label class="field"><span>¿Cuál será tu enfoque principal?</span><textarea id="rFocus" rows="3" placeholder="Una prioridad clara para la próxima semana…" required></textarea></label><fieldset class="rating"><legend>¿Cómo calificas tu semana?</legend><div>${[1,2,3,4,5].map(n=>`<button type="button" data-rating="${n}" class="${state.rating===n?'active':''}">${n}</button>`).join('')}</div></fieldset><button class="btn primary" style="width:100%" type="submit">Guardar mi revisión</button></form>
        <aside class="review-history"><div class="card-heading"><span class="step">02</span><div><h2>Tu aprendizaje</h2><p>Revisar crea claridad. La claridad crea mejores decisiones.</p></div></div>${state.reviews.length?state.reviews.slice(0,5).map(r=>`<article class="review-entry"><div class="entry-top"><time>${fmtFull(r.date)}</time><span>${'●'.repeat(r.rating)}${'○'.repeat(5-r.rating)}</span></div><strong>${esc(r.wins)}</strong><p>Próximo enfoque: ${esc(r.nextFocus)}</p></article>`).join(''):'<div class="history-empty"><span>↻</span><h3>Aquí aparecerá tu evolución</h3><p>Completa tu primera revisión para comenzar a reconocer patrones.</p></div>'}</aside></div>${state.checkins.length?`<section class="activity"><div class="section-head"><div><span class="eyebrow">Últimos movimientos</span><h2>Historial de avances</h2></div></div><div class="activity-list">${state.checkins.slice(0,6).map(c=>`<div class="activity-row"><span class="activity-check">✓</span><div><strong>${esc(c.goalTitle)}</strong><small>${new Intl.DateTimeFormat('es-CO',{dateStyle:'medium',timeStyle:'short'}).format(new Date(c.date))}</small></div><b>${c.progress}%</b></div>`).join('')}</div></section>`:''}</div>`}
      function render(){nav();state.view==='panel'?renderPanel():state.view==='goals'?renderGoals():renderReview()}
      function blank(h='weekly'){return{title:'',category:'Personal',horizon:h,startDate:isoOffset(0),dueDate:isoOffset(h==='weekly'?7:h==='monthly'?30:h==='short'?120:365),current:0,target:1,unit:'veces',why:'',nextAction:'',weeklyHours:1,availableHours:3}}
      function formData(){return{title:$('fTitle').value.trim(),category:$('fCategory').value,horizon:$('fHorizon').value,startDate:$('fStart').value,dueDate:$('fDue').value,current:Number($('fCurrent').value),target:Number($('fTarget').value),unit:$('fUnit').value.trim(),why:$('fWhy').value.trim(),nextAction:$('fAction').value.trim(),weeklyHours:Number($('fHours').value),availableHours:Number($('fAvailable').value)}}
      function checks(d){const duration=daysBetween(d.startDate,d.dueDate),fits=(d.horizon==='weekly'&&duration>0&&duration<=14)||(d.horizon==='monthly'&&duration>0&&duration<=45)||(d.horizon==='short'&&duration>=14&&duration<=365)||(d.horizon==='long'&&duration>=90);return[['Es específica',d.title.length>=6],['Se puede medir',d.target>0&&d.unit.length>0],['Tiene una razón clara',d.why.length>=12],['Tiene siguiente acción',d.nextAction.length>=6],['El tiempo es coherente',fits],['Cabe en tu semana',d.weeklyHours>0&&d.weeklyHours<=d.availableHours]]}
      function updateScore(){const d=formData(),list=checks(d),score=Math.round(list.filter(x=>x[1]).length/list.length*100);$('scoreRing').style.setProperty('--score',score*3.6+'deg');$('scoreValue').textContent=score+'%';$('scoreTitle').textContent=score>=84?'Meta bien construida':score>=67?'Vas por buen camino':'Todavía puede mejorar';$('checkList').innerHTML=list.map(x=>`<li class="${x[1]?'done':''}"><i>${x[1]?'✓':'·'}</i>${x[0]}</li>`).join('');$('warning').hidden=!(d.weeklyHours>d.availableHours);return score}
      function fillForm(d){$('fTitle').value=d.title;$('fCategory').value=d.category;$('fHorizon').value=d.horizon;$('fStart').value=d.startDate;$('fDue').value=d.dueDate;$('fCurrent').value=d.current;$('fTarget').value=d.target;$('fUnit').value=d.unit;$('fWhy').value=d.why;$('fAction').value=d.nextAction;$('fHours').value=d.weeklyHours;$('fAvailable').value=d.availableHours;updateScore()}
      function openGoal(goal=null){state.editing=goal?.id||null;$('dialogTitle').textContent=goal?'Editar meta':'Nueva meta';$('saveButton').textContent=goal?'Guardar cambios':'Crear meta';$('deleteButton').hidden=!goal;fillForm(goal||blank(state.horizon));dialog.showModal();setTimeout(()=>$('fTitle').focus(),50)}
      function updateGoal(goal,value){value=clamp(value,0,goal.target);const p=Math.round(value/goal.target*100),date=nowISO();state.goals=state.goals.map(g=>g.id===goal.id?{...g,current:value,status:p>=100?'completed':'active',updatedAt:date}:g);state.checkins=[{id:id(),goalId:goal.id,goalTitle:goal.title,progress:p,date},...state.checkins].slice(0,100);persist();render();toast(p>=100?'¡Meta cumplida! Celebra este avance.':'Progreso actualizado al '+p+'%.')}
      function exportData(){const blob=new Blob([JSON.stringify({goals:state.goals,checkins:state.checkins,reviews:state.reviews},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='respaldo-mi-ruta-'+isoOffset(0)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Respaldo descargado.')}
      document.addEventListener('click',e=>{const b=e.target.closest('button,[data-action]');if(!b)return;if(b.dataset.view){state.view=b.dataset.view;render();scrollTo({top:0,behavior:'smooth'});return}const action=b.dataset.action;if(action==='new')openGoal();if(action==='close')dialog.close();if(action==='export')exportData();if(action==='import')$('importInput').click();if(b.dataset.horizon){state.horizon=b.dataset.horizon;persist();render()}if(b.dataset.rating){state.rating=Number(b.dataset.rating);document.querySelectorAll('[data-rating]').forEach(x=>x.classList.toggle('active',x.dataset.rating==state.rating))}if(['edit','pause','minus','plus','complete'].includes(action)){const g=state.goals.find(x=>x.id===b.dataset.id);if(!g)return;if(action==='edit')openGoal(g);if(action==='pause'){g.status=g.status==='paused'?'active':'paused';g.updatedAt=nowISO();persist();render()}if(action==='minus')updateGoal(g,g.current-Math.max(g.target/10,1));if(action==='plus')updateGoal(g,g.current+Math.max(g.target/10,1));if(action==='complete')updateGoal(g,g.target)}});
      app.addEventListener('input',e=>{if(e.target.id==='searchInput'){state.search=e.target.value;renderGoals();$('searchInput').focus();$('searchInput').setSelectionRange(state.search.length,state.search.length)}});app.addEventListener('change',e=>{if(e.target.id==='statusFilter'){state.status=e.target.value;renderGoals()}});
      $('themeButton').addEventListener('click',()=>{state.theme=state.theme==='light'?'dark':'light';document.documentElement.dataset.theme=state.theme;$('themeButton').textContent=state.theme==='light'?'◐':'○';persist()});$('themeButton').textContent=state.theme==='light'?'◐':'○';
      $('goalForm').addEventListener('input',updateScore);$('fHorizon').addEventListener('change',()=>{$('fDue').value=blank($('fHorizon').value).dueDate;updateScore()});
      $('goalForm').addEventListener('submit',e=>{e.preventDefault();const d=formData(),score=updateScore();if(score<67){toast('Completa al menos 4 criterios para crear una meta sólida.');return}const n=nowISO();if(state.editing){state.goals=state.goals.map(g=>g.id===state.editing?{...g,...d,status:progress(d)>=100?'completed':g.status,updatedAt:n}:g);toast('Meta actualizada.')}else{state.goals.unshift({...d,id:id(),status:progress(d)>=100?'completed':'active',createdAt:n,updatedAt:n});state.horizon=d.horizon;toast('Meta creada. Ya tienes una ruta clara.')}persist();dialog.close();render()});
      $('deleteButton').addEventListener('click',()=>{const g=state.goals.find(x=>x.id===state.editing);if(!g||!confirm('¿Eliminar “'+g.title+'”? Esta acción no se puede deshacer.'))return;state.goals=state.goals.filter(x=>x.id!==g.id);state.checkins=state.checkins.filter(x=>x.goalId!==g.id);persist();dialog.close();render();toast('Meta eliminada.')});
      $('importInput').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(!Array.isArray(d.goals))throw Error();state.goals=d.goals;state.checkins=Array.isArray(d.checkins)?d.checkins:[];state.reviews=Array.isArray(d.reviews)?d.reviews:[];persist();render();toast('Respaldo restaurado correctamente.')}catch(err){toast('No pude leer ese respaldo.')}e.target.value=''});
      app.addEventListener('submit',e=>{if(e.target.id!=='reviewForm')return;e.preventDefault();const wins=$('rWins').value.trim(),blocks=$('rBlocks').value.trim(),nextFocus=$('rFocus').value.trim();if(!wins||!nextFocus){toast('Escribe al menos tu logro y tu próximo enfoque.');return}state.reviews.unshift({id:id(),date:nowISO(),wins,blocks,nextFocus,rating:state.rating});persist();render();toast('Revisión guardada. Tu próxima semana ya tiene dirección.')});
      dialog.addEventListener('click',e=>{const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()});
      render();
    })();
  </script>
</body>
</html>
