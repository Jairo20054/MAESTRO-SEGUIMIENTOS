    .strategy-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.strategy-block{padding:22px;border:1px solid var(--line);border-radius:19px;background:var(--surface)}.strategy-block h3{margin:0;font-family:var(--serif);font-size:25px;font-weight:500}.strategy-block>p{margin:8px 0 17px;color:var(--muted);font-size:12px;line-height:1.55}.scope-list{display:grid;grid-template-columns:1fr 1fr;gap:9px}.scope-item{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}.scope-item span{display:block;color:var(--faint);font-size:8px;font-weight:850;text-transform:uppercase;letter-spacing:.07em}.scope-item strong{display:block;margin-top:5px;font-size:11px;line-height:1.45}.scope-item.out{border-color:color-mix(in srgb,var(--danger) 25%,var(--line));background:var(--danger-soft)}
    .mobile-nav{display:none}
    dialog{width:min(760px,calc(100% - 28px));max-height:calc(100vh - 32px);padding:0;border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink);box-shadow:0 40px 120px rgba(0,0,0,.3);overflow:auto}dialog::backdrop{background:rgba(4,15,10,.62);backdrop-filter:blur(8px)}.dialog-head{position:sticky;top:0;z-index:2;padding:21px 22px;display:flex;justify-content:space-between;align-items:start;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(15px)}.dialog-head h2{margin:4px 0 0;font-family:var(--serif);font-size:30px;font-weight:500}.close{width:42px;height:42px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink);font-size:19px}.entity-form{padding:22px;display:grid;gap:15px}.dialog-foot{position:sticky;bottom:0;padding:14px 22px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(15px)}

    @media(max-width:1180px){.shell{grid-template-columns:230px minmax(0,1fr)}.sidebar{padding-inline:12px}.content{padding-inline:24px}.kpi-grid{grid-template-columns:repeat(3,1fr)}.hero{grid-template-columns:1fr}.hero-panel{max-width:650px}.task-row{grid-template-columns:auto minmax(0,1fr) auto auto}.task-owner{display:none}.kanban{grid-template-columns:repeat(4,260px)}}

    @media(max-width:640px){.topbar{height:67px}.breadcrumb small{display:none}.breadcrumb strong{font-size:12px}.top-actions .secondary{display:none}.content{padding-inline:12px}.hero{padding:25px 20px;border-radius:21px}.hero h1,.page-head h1{font-size:clamp(39px,12vw,54px)}.hero-actions .btn{width:100%}.kpi-grid{grid-template-columns:repeat(2,1fr);gap:9px}.kpi{min-height:105px;padding:14px}.kpi strong{font-size:29px}.section-head,.page-head{display:grid;align-items:start}.section-actions,.page-actions{width:100%}.section-actions .btn,.page-actions .btn{flex:1}.grid-2,.grid-3{gap:12px}.panel{padding:18px}.scope-list{grid-template-columns:1fr}.phase-head{grid-template-columns:auto 1fr auto;padding:15px}.phase-stats{display:none}.phase-body{padding:0 14px 14px}.task-row{grid-template-columns:auto 1fr auto}.task-date{display:none}.task-actions .mini:first-child{display:none}.goal-card,.risk-card{padding:16px}.risk-meta{grid-template-columns:1fr}.review-form,.review-history{padding:17px}.form-grid.two{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.toolbar>*{grid-column:1/-1}.decision-table{display:block;overflow-x:auto}.dialog-foot{flex-wrap:wrap}.dialog-foot .danger{width:100%}.toast{left:14px;right:14px;bottom:82px;max-width:none}}

<body>

      <nav class="nav" aria-label="Navegación principal">

        <button class="nav-btn" data-view="strategy"><span class="nav-icon">◎</span>Estrategia</button>
        <button class="nav-btn" data-view="roadmap"><span class="nav-icon">◫</span>Roadmap <small id="roadmapBadge">0%</small></button>

      </div>

    <div class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:10px"><button class="icon-btn mobile-menu" id="menuButton" aria-label="Abrir menú">☰</button><div class="breadcrumb"><small>NIDO / Sistema de implementación</small><strong id="viewTitle">Panel CEO</strong></div></div>
        <div class="top-actions"><button class="btn secondary" data-view="review">Revisión semanal</button><button class="btn primary" data-action="new" data-type="task">＋ Nueva tarea</button></div>

    </div>
  </div>

  <nav class="mobile-nav" aria-label="Navegación móvil">

    <button class="nav-btn" data-view="execution"><span class="nav-icon">▦</span>Hacer</button>

  <dialog id="entityDialog" aria-labelledby="dialogTitle">

    <form id="entityForm"><div class="entity-form" id="entityFields"></div><div class="dialog-foot"><button class="btn danger" type="button" id="deleteEntity" hidden>Eliminar</button><button class="btn secondary" type="button" data-action="close">Cancelar</button><button class="btn primary" type="submit" id="saveEntity">Guardar</button></div></form>

  <div class="toast" id="toast" role="status"><i>✓</i><span></span></div>

  <script>
  (()=>{
    'use strict';
    const KEY='nido-ceo-os-v1';
    const today=()=>new Date().toISOString().slice(0,10);
    const now=()=>new Date().toISOString();
    const uid=()=>crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(16).slice(2);
    const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const clamp=(v,min,max)=>Math.min(Math.max(Number(v)||0,min),max);
    const fmtDate=v=>v?new Intl.DateTimeFormat('es-CO',{day:'numeric',month:'short',year:'numeric'}).format(new Date(v+'T12:00:00')):'Sin fecha';
    const fmtFull=v=>new Intl.DateTimeFormat('es-CO',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v));
    const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
    const app=document.getElementById('app'),dialog=document.getElementById('entityDialog');

    const phaseDefinitions=[
      {id:'p0',order:0,name:'Dirección estratégica',duration:'Semana 1',objective:'Definir con precisión qué problema resuelve NIDO, para quién y cómo se medirá el éxito.',deliverable:'Documento de visión, alcance MVP, modelo de negocio y tablero de métricas.',gate:'No iniciar desarrollo nuevo hasta aprobar visión, usuario objetivo, alcance y métricas.',tasks:[
        ['Definir problema central y propuesta de valor','CEO','critical','NIDO reduce fricción, abuso y trámites en el arriendo residencial.'],
        ['Elegir segmento inicial y ciudad piloto','CEO','critical','Iniciar con un segmento y una ciudad; recomendación: Cali y arrendamientos residenciales.'],
        ['Definir alcance MVP y lista explícita de no-alcance','CEO / Producto','critical','Evitar construir app nativa, IA avanzada o expansión nacional antes de validar.'],
        ['Diseñar modelo de ingresos y supuestos financieros','CEO / Finanzas','high','Comisión, costos de pago, soporte, adquisición y margen por transacción.'],
        ['Definir North Star Metric y métricas de embudo','CEO / Datos','high','Postulaciones calificadas que avanzan a aceptación por semana.'],
        ['Crear criterios de decisión y reglas anti-improvisación','CEO','high','Toda nueva función debe tener problema, usuario, KPI, costo y prioridad.']
      ]},
      {id:'p1',order:1,name:'Descubrimiento y validación',duration:'Semanas 1–3',objective:'Demostrar que el problema existe, es frecuente y alguien está dispuesto a cambiar su forma de arrendar.',deliverable:'Entrevistas, mapa de dolores, hipótesis priorizadas, prototipo probado y señal de intención.',gate:'Continuar solo si hay evidencia repetida del problema y usuarios dispuestos a probar el flujo.',tasks:[
        ['Entrevistar 15 arrendatarios recientes','CEO / Research','critical','Documentar pasos, abusos, abandonos, tiempos y desconfianza.'],
        ['Entrevistar 10 propietarios o administradores','CEO / Research','critical','Identificar riesgos, documentos, criterios y objeciones reales.'],
        ['Mapear proceso actual de punta a punta','Producto','high','Desde búsqueda hasta entrega del inmueble y primer pago.'],
        ['Priorizar los cinco dolores de mayor impacto','Producto','high','Usar frecuencia, gravedad, disposición de pago y viabilidad.'],
        ['Probar prototipo navegable con 8 usuarios','UX','critical','Medir comprensión, confianza y finalización de tareas.'],
        ['Conseguir 5 propietarios y 10 interesados para piloto','CEO / Growth','critical','Señal de intención antes de invertir en funcionalidades secundarias.']
      ]},
      {id:'p2',order:2,name:'Producto y experiencia',duration:'Semanas 3–5',objective:'Convertir la evidencia en un flujo simple, verificable y coherente para arrendatario, propietario y administrador.',deliverable:'PRD, flujos, wireframes, diseño responsive, estados y criterios de aceptación.',gate:'Cada pantalla debe tener objetivo, dueño, estado vacío, error, carga y criterio de aceptación.',tasks:[
        ['Redactar PRD del MVP','Producto','critical','Problema, usuarios, alcance, historias, restricciones y métricas.'],
        ['Diseñar journey del arrendatario','UX / Producto','critical','Buscar, comparar, visitar o no, postular, documentos, aceptar y pagar.'],
        ['Diseñar journey del propietario','UX / Producto','critical','Publicar, revisar, responder en 3 días, aprobar y administrar.'],
        ['Diseñar panel administrativo y auditoría','UX / Operaciones','high','Revisión documental, incidencias, estados y trazabilidad.'],
        ['Crear sistema de diseño y componentes','UX / Frontend','medium','Tipografía, color, formularios, tarjetas, tablas y estados.'],
        ['Definir criterios de aceptación por historia','Producto / QA','critical','Condiciones funcionales, seguridad, responsive y analítica.']
      ]},
      {id:'p3',order:3,name:'Arquitectura, datos y seguridad',duration:'Semanas 4–6',objective:'Construir una base segura y mantenible antes de acelerar el desarrollo.',deliverable:'Arquitectura aprobada, esquema de datos, RLS, entornos, secretos y plan de observabilidad.',gate:'Ningún dato sensible ni pago se libera sin permisos mínimos, trazabilidad y pruebas.',tasks:[
        ['Definir arquitectura modular del MVP','Tech Lead','critical','React, Node/Express, Supabase/PostgreSQL, Storage y servicios externos.'],
        ['Diseñar esquema de datos y estados del arriendo','Backend / Datos','critical','Usuarios, roles, propiedades, postulaciones, documentos, contratos, pagos y eventos.'],
        ['Implementar RLS y privilegios mínimos','Backend / Seguridad','critical','Cada rol accede únicamente a sus recursos y acciones autorizadas.'],
        ['Configurar desarrollo, preview y producción','DevOps','critical','Variables separadas, bases y buckets controlados, dominio y ramas.'],
        ['Proteger documentos y carga de archivos','Backend / Seguridad','critical','MIME/magic bytes, límites, URLs firmadas, retención y auditoría.'],
        ['Definir logging, alertas, respaldo y recuperación','DevOps','high','Errores, eventos críticos, uptime, backups y runbook de restauración.']
      ]},
      {id:'p4',order:4,name:'Construcción del MVP',duration:'Semanas 6–14',objective:'Entregar el flujo mínimo completo que permite publicar, postular, aprobar, aceptar y pagar.',deliverable:'MVP funcional de extremo a extremo en ambiente de pruebas.',gate:'No se acepta una función aislada: debe funcionar en el flujo completo y tener pruebas.',tasks:[
        ['Autenticación, perfiles y roles','Frontend / Backend','critical','Registro, Google, recuperación, perfil y autorización por rol.'],
        ['Publicación y administración de propiedades','Frontend / Backend','critical','Formulario por pasos, medios, ubicación, reglas y disponibilidad.'],
        ['Búsqueda, filtros, detalle y comparación','Frontend','critical','Ciudad, barrio, servicios, precio, detalle, favoritos y comparación útil.'],
        ['Postulación y opción de visita','Full Stack','critical','Visitar o continuar sin visita, estado y recordatorios.'],
        ['Expediente documental privado','Backend / Frontend','critical','Carga, revisión, rechazo, corrección y trazabilidad.'],
        ['Revisión del propietario con SLA de 3 días','Full Stack','critical','Notificaciones, vencimiento, decisión y justificación.'],
        ['Aceptación contractual de un clic','Backend / Legal / Frontend','critical','Versión inmutable, hash, evidencia, términos y PDF final.'],
        ['Pagos Wompi Sandbox e idempotencia','Backend','critical','Monto en servidor, checkout, webhook como autoridad y conciliación.'],
        ['Notificaciones y línea de tiempo','Full Stack','high','Correo/in-app para hitos, vencimientos y acciones pendientes.'],
        ['Panel administrativo operativo','Frontend / Backend','high','Casos, revisión, soporte, bloqueos y auditoría.']
      ]},
      {id:'p5',order:5,name:'Calidad, legal y operación',duration:'Semanas 12–16',objective:'Reducir fallos, exposición legal y fricción operativa antes de invitar usuarios reales.',deliverable:'Informe QA, documentos legales revisados, manuales operativos y plan de soporte.',gate:'Cero vulnerabilidades críticas; flujos críticos aprobados; aspectos legales validados por profesional.',tasks:[
        ['Pruebas unitarias, integración y E2E','QA / Ingeniería','critical','Cubrir autenticación, propiedad, postulación, documentos, contrato y pago.'],
        ['Pruebas responsive y accesibilidad','QA / Frontend','high','Móvil, tablet, escritorio, teclado, contraste y mensajes claros.'],
        ['Pentest y revisión de secretos','Seguridad','critical','Dependencias, exposición, permisos, inyección, archivos y sesiones.'],
        ['Validar términos, privacidad y tratamiento de datos','Legal','critical','Revisión con abogado colombiano; no asumir validez jurídica automática.'],
        ['Definir política de comisión, garantía y reembolsos','Legal / Finanzas','critical','Reglas transparentes, custodia, disputas y responsabilidades.'],
        ['Crear runbooks de soporte e incidentes','Operaciones','high','SLA, escalamiento, evidencias, fraude, pago fallido y caída.'],
        ['Configurar analítica de producto','Producto / Datos','high','Eventos del embudo, abandono, tiempos, errores y conversión.']
      ]},
      {id:'p6',order:6,name:'Piloto controlado',duration:'Semanas 16–20',objective:'Validar el sistema con pocos usuarios, acompañamiento cercano y métricas reales.',deliverable:'Piloto con resultados, incidencias priorizadas, aprendizaje y decisión go/no-go.',gate:'Escalar solo si el flujo funciona, existe confianza y las métricas mínimas se cumplen.',tasks:[
        ['Seleccionar cohorte piloto','CEO / Growth','critical','5–10 propiedades y 20–30 arrendatarios potenciales.'],
        ['Onboarding manual de propietarios','Operaciones','high','Asegurar calidad de publicación, expectativas y soporte.'],
        ['Acompañar postulaciones de punta a punta','Operaciones / Producto','critical','Observar fricción real y registrar cada abandono.'],
        ['Medir embudo y tiempos por etapa','Datos / Producto','critical','Búsqueda→detalle→postulación→aprobación→pago.'],
        ['Resolver errores por severidad','Ingeniería / QA','critical','P0 inmediato, P1 antes de escalar, P2 planificado.'],
        ['Realizar entrevistas postuso','Research','high','Confianza, claridad, esfuerzo, valor y disposición a recomendar.'],
        ['Tomar decisión go, ajustar o detener','CEO / Comité','critical','Decisión basada en evidencia, no en apego al producto.']
      ]},
      {id:'p7',order:7,name:'Despliegue total',duration:'Semanas 20–22',objective:'Llevar NIDO a producción de forma controlada, reversible y observable.',deliverable:'Producción estable, dominio, monitoreo, soporte y plan de rollback.',gate:'Liberación aprobada con checklist, responsable, ventana, respaldo y reversión probada.',tasks:[
        ['Cerrar checklist de release','Tech Lead / QA','critical','Código, migraciones, variables, pruebas, legal, soporte y comunicación.'],
        ['Preparar migraciones y respaldo','Backend / DevOps','critical','Ensayo en preview, backup verificado y plan de rollback.'],
        ['Configurar dominio, SSL y producción','DevOps','critical','DNS, certificados, redirecciones y seguridad de cabeceras.'],
        ['Activar monitoreo y alertas','DevOps','critical','Disponibilidad, errores, latencia, pagos, correos y jobs.'],
        ['Despliegue gradual y smoke tests','QA / DevOps','critical','Validar usuarios, propiedades, documentos, contrato y pago.'],
        ['Abrir soporte y war room inicial','Operaciones / Ingeniería','high','Canal, responsables, horarios, severidad y comunicación.'],
        ['Publicar versión y comunicación de lanzamiento','CEO / Growth','medium','Mensaje honesto, alcance inicial y canal de retroalimentación.']
      ]},
      {id:'p8',order:8,name:'Crecimiento y mantenimiento',duration:'Continuo',objective:'Mejorar retención, confianza y eficiencia sin perder estabilidad ni enfoque.',deliverable:'Cadencia de producto, métricas, mantenimiento, aprendizaje y expansión controlada.',gate:'Toda expansión debe superar criterios de retención, operación, seguridad y economía unitaria.',tasks:[
        ['Revisión semanal de métricas y funnel','CEO / Producto','critical','Detectar cuellos de botella y decidir una prioridad.'],
        ['Plan mensual de mantenimiento técnico','Tech Lead','high','Dependencias, deuda técnica, costos, rendimiento y seguridad.'],

    }

    function renderGoals(){
      app.innerHTML=`<div class="content"><section class="page-head"><div><span class="eyebrow">Resultados, no actividad</span><h1>Objetivos NIDO</h1><p>Cada objetivo conecta la estrategia con resultados medibles. Los key results se actualizan con evidencia, no por sensación.</p></div><div class="page-actions"><button class="btn primary" data-action="new" data-type="goal">＋ Nuevo objetivo</button></div></section><div class="goal-grid">${state.goals.map(g=>{const gp=goalProgress(g);return `<article class="goal-card"><div class="goal-top"><div><span class="eyebrow">${esc(g.period)}</span><h3>${esc(g.title)}</h3></div><strong class="goal-score">${gp}%</strong></div><p>${esc(g.why)}</p>${progressBar(gp)}<div class="kr-list" style="margin-top:15px">${g.krs.map(k=>`<div class="kr"><div class="kr-head"><strong>${esc(k.title)}</strong><span>${k.progress}%</span></div><div class="kr-actions">${progressBar(k.progress)}<button data-action="kr-minus" data-goal="${g.id}" data-id="${k.id}">−</button><button data-action="kr-plus" data-goal="${g.id}" data-id="${k.id}">＋</button></div></div>`).join('')}</div><div style="margin-top:14px;text-align:right"><button class="btn ghost small" data-action="edit" data-type="goal" data-id="${g.id}">Editar</button></div></article>`}).join('')}</div></div>`;
    }

    function renderRisks(){
      const sorted=[...state.risks].sort((a,b)=>riskScore(b)-riskScore(a));
      app.innerHTML=`<div class="content"><section class="page-head"><div><span class="eyebrow">Anticipar antes de reaccionar</span><h1>Registro de riesgos</h1><p>Un riesgo sin dueño ni mitigación es solo una sorpresa pendiente. Revisa los riesgos críticos cada semana.</p></div><div class="page-actions"><button class="btn primary" data-action="new" data-type="risk">＋ Nuevo riesgo</button></div></section><div class="risk-grid">${sorted.map(r=>`<article class="risk-card"><div class="risk-top"><div><span class="eyebrow">${esc(r.category)}</span><h3>${esc(r.title)}</h3></div><span class="risk-score">${riskScore(r)}</span></div><p><strong>Mitigación:</strong> ${esc(r.mitigation)}</p><div class="risk-meta"><div><span>Probabilidad</span><strong>${r.probability}/5</strong></div><div><span>Impacto</span><strong>${r.impact}/5</strong></div><div><span>Responsable</span><strong>${esc(r.owner)}</strong></div></div><div class="risk-foot"><span class="tag ${r.status==='closed'||r.status==='mitigated'?'done':riskScore(r)>=20?'critical':riskScore(r)>=12?'high':'medium'}">${riskStatusLabels[r.status]}</span><div><button class="btn ghost small" data-action="risk-next" data-id="${r.id}">Cambiar estado</button><button class="btn ghost small" data-action="edit" data-type="risk" data-id="${r.id}">Editar</button></div></div></article>`).join('')}</div></div>`;
    }

    function renderDecisions(){
      app.innerHTML=`<div class="content"><section class="page-head"><div><span class="eyebrow">Memoria ejecutiva</span><h1>Registro de decisiones</h1><p>Documentar por qué se tomó una decisión evita repetir discusiones y permite corregir con contexto.</p></div><div class="page-actions"><button class="btn primary" data-action="new" data-type="decision">＋ Nueva decisión</button></div></section>${state.decisions.length?`<table class="decision-table"><thead><tr><th>Fecha</th><th>Decisión</th><th>Razón</th><th>Responsable</th><th>Estado</th><th></th></tr></thead><tbody>${state.decisions.map(d=>`<tr><td>${fmtDate(d.date)}</td><td><strong>${esc(d.decision)}</strong></td><td><small>${esc(d.reason)}</small></td><td>${esc(d.owner)}</td><td><span class="tag ${d.status==='active'?'doing':d.status==='reversed'?'blocked':'done'}">${d.status==='active'?'Vigente':d.status==='reversed'?'Revertida':'Superada'}</span></td><td><button class="mini" data-action="edit" data-type="decision" data-id="${d.id}">✎</button></td></tr>`).join('')}</tbody></table>`:empty('Sin decisiones registradas','Documenta la próxima decisión relevante para NIDO.')}</div>`;
    }

    function renderReview(){
      const m=metrics(),recent=state.reviews.slice(0,6);
      app.innerHTML=`<div class="content"><section class="page-head"><div><span class="eyebrow">Cadencia de liderazgo</span><h1>Revisión semanal CEO</h1><p>Reserva una sesión semanal para revisar evidencia, eliminar bloqueos y elegir una sola prioridad principal.</p></div><div class="page-actions"><span class="stage-pill">${fmtDate(today())}</span></div></section><section class="kpi-grid" style="grid-template-columns:repeat(4,1fr)"><article class="kpi"><div class="kpi-top"><span>Progreso</span><span class="kpi-icon">◉</span></div><strong>${m.overall}%</strong><p>Avance total del programa.</p></article><article class="kpi"><div class="kpi-top"><span>En curso</span><span class="kpi-icon">▶</span></div><strong>${m.active}</strong><p>Trabajo activo esta semana.</p></article><article class="kpi"><div class="kpi-top"><span>Bloqueos</span><span class="kpi-icon">!</span></div><strong>${m.blocked}</strong><p>Decisiones que no pueden esperar.</p></article><article class="kpi"><div class="kpi-top"><span>Riesgos</span><span class="kpi-icon">△</span></div><strong>${m.openRisks}</strong><p>Riesgos aún no cerrados.</p></article></section><div class="review-layout" style="margin-top:18px"><form class="review-form" id="reviewForm"><span class="eyebrow">Cierre de semana</span><h2 style="font-family:var(--serif);font-weight:500;margin:6px 0 20px">Decide con evidencia</h2><label class="field"><span>¿Qué resultado concreto avanzó?</span><textarea id="rWins" rows="3" required placeholder="Entregables, métricas o validaciones reales"></textarea></label><label class="field"><span>¿Qué bloqueó al equipo o al proyecto?</span><textarea id="rBlocks" rows="3" placeholder="Dependencias, decisiones, errores o falta de claridad"></textarea></label><label class="field"><span>¿Qué aprendimos de usuarios, producto o tecnología?</span><textarea id="rLearn" rows="3" required placeholder="Una conclusión que cambie la siguiente decisión"></textarea></label><label class="field"><span>Única prioridad principal de la próxima semana</span><textarea id="rFocus" rows="2" required placeholder="Solo una prioridad principal"></textarea></label><label class="field"><span>Decisión que debe tomarse</span><textarea id="rDecision" rows="2" placeholder="Qué debe decidirse, por quién y antes de cuándo"></textarea></label><fieldset class="rating"><legend>Confianza en la dirección actual</legend><div>${[1,2,3,4,5].map(n=>`<button type="button" data-rating="${n}" class="${state.rating===n?'active':''}">${n}</button>`).join('')}</div></fieldset><button class="btn primary" style="width:100%" type="submit">Guardar revisión ejecutiva</button></form><aside class="review-history"><span class="eyebrow">Historial</span><h2 style="font-family:var(--serif);font-weight:500;margin:6px 0 14px">Decisiones y aprendizaje</h2>${recent.length?recent.map(r=>`<article class="history-entry"><time>${fmtFull(r.date)} · Confianza ${r.rating}/5</time><strong>${esc(r.wins)}</strong><p><b>Aprendizaje:</b> ${esc(r.learning)}</p><p><b>Próximo foco:</b> ${esc(r.focus)}</p>${r.decision?`<p><b>Decisión:</b> ${esc(r.decision)}</p>`:''}</article>`).join(''):`<div class="empty" style="min-height:280px"><div><b>↻</b><h3>Primera revisión pendiente</h3><p>Completa la revisión para crear una memoria ejecutiva de NIDO.</p></div></div>`}</aside></div></div>`;
    }

    function render(){nav();({dashboard:renderDashboard,strategy:renderStrategy,roadmap:renderRoadmap,execution:renderExecution,goals:renderGoals,risks:renderRisks,decisions:renderDecisions,review:renderReview}[state.view]||renderDashboard)()}

    function cycleTask(t){const order=['pending','doing','blocked','done'];t.status=order[(order.indexOf(t.status)+1)%order.length];t.updatedAt=now();log(`Tarea “${t.title}” cambió a ${statusLabels[t.status]}.`);persist();render();toast('Estado actualizado: '+statusLabels[t.status])}
    function setTaskStatus(id,status){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.status=status;t.updatedAt=now();log(`Tarea “${t.title}” cambió a ${statusLabels[t.status]}.`);persist();render()}
    function updateKR(goalId,krId,delta){const g=state.goals.find(x=>x.id===goalId),k=g?.krs.find(x=>x.id===krId);if(!k)return;k.progress=clamp(k.progress+delta,0,100);log(`Key result “${k.title}” actualizado a ${k.progress}%.`);persist();render();toast('Resultado actualizado')}
    function approvePhase(id){const ps=phaseState(id),tasks=phaseTasks(id),allDone=tasks.every(t=>t.status==='done');if(!ps.approved&&!allDone){toast('Aún hay entregables pendientes. No se puede aprobar la fase.');return}ps.approved=!ps.approved;log(`${phaseData(id).name}: fase ${ps.approved?'aprobada':'reabierta'}.`,'phase');persist();render();toast(ps.approved?'Fase aprobada con registro.':'Fase reabierta.')}
    function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='NIDO-CEO-OS-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);toast('Respaldo de NIDO descargado.')}

    function companyFields(){return `<div class="form-grid two"><label class="field"><span>Ciudad piloto</span><input id="ePilot" value="${esc(state.company.pilotCity)}" required></label><label class="field"><span>Segmento inicial</span><input id="eSegment" value="${esc(state.company.segment)}" required></label></div><label class="field"><span>Visión</span><textarea id="eVision" rows="3" required>${esc(state.company.vision)}</textarea></label><label class="field"><span>North Star Metric</span><input id="eNorth" value="${esc(state.company.northStar)}" required></label><label class="field"><span>Modelo de ingresos / supuesto</span><input id="eCommission" value="${esc(state.company.commission)}" required></label>`}
    function taskFields(t={}){return `<label class="field"><span>Título de la tarea</span><input id="eTitle" value="${esc(t.title||'')}" required></label><label class="field"><span>Descripción / evidencia esperada</span><textarea id="eDescription" rows="3" required>${esc(t.description||'')}</textarea></label><div class="form-grid two"><label class="field"><span>Fase</span><select id="ePhase">${phaseDefinitions.map(p=>`<option value="${p.id}" ${p.id===(t.phaseId||currentPhase().id)?'selected':''}>${p.order}. ${esc(p.name)}</option>`).join('')}</select></label><label class="field"><span>Responsable</span><input id="eOwner" value="${esc(t.owner||'CEO')}" required></label></div><div class="form-grid two"><label class="field"><span>Prioridad</span><select id="ePriority">${Object.entries(priorityLabels).map(([k,v])=>`<option value="${k}" ${k===(t.priority||'high')?'selected':''}>${v}</option>`).join('')}</select></label><label class="field"><span>Estado</span><select id="eStatus">${Object.entries(statusLabels).map(([k,v])=>`<option value="${k}" ${k===(t.status||'pending')?'selected':''}>${v}</option>`).join('')}</select></label></div><label class="field"><span>Fecha objetivo</span><input type="date" id="eDue" value="${esc(t.dueDate||'')}"></label>`}
    function goalFields(g={}){return `<label class="field"><span>Objetivo</span><input id="eTitle" value="${esc(g.title||'')}" required></label><div class="form-grid two"><label class="field"><span>Periodo</span><input id="ePeriod" value="${esc(g.period||'Trimestre')}" required></label><label class="field"><span>Por qué importa</span><input id="eWhy" value="${esc(g.why||'')}" required></label></div><label class="field"><span>Key results (uno por línea)</span><textarea id="eKrs" rows="6" required>${esc((g.krs||[]).map(k=>k.title).join('\n'))}</textarea></label>`}
    function riskFields(r={}){return `<label class="field"><span>Riesgo</span><input id="eTitle" value="${esc(r.title||'')}" required></label><div class="form-grid two"><label class="field"><span>Categoría</span><input id="eCategory" value="${esc(r.category||'Producto')}" required></label><label class="field"><span>Responsable</span><input id="eOwner" value="${esc(r.owner||'CEO')}" required></label></div><div class="form-grid two"><label class="field"><span>Probabilidad (1–5)</span><input type="number" id="eProbability" min="1" max="5" value="${r.probability||3}" required></label><label class="field"><span>Impacto (1–5)</span><input type="number" id="eImpact" min="1" max="5" value="${r.impact||3}" required></label></div><label class="field"><span>Plan de mitigación</span><textarea id="eMitigation" rows="4" required>${esc(r.mitigation||'')}</textarea></label><label class="field"><span>Estado</span><select id="eRiskStatus">${Object.entries(riskStatusLabels).map(([k,v])=>`<option value="${k}" ${k===(r.status||'open')?'selected':''}>${v}</option>`).join('')}</select></label>`}
    function decisionFields(d={}){return `<label class="field"><span>Decisión</span><textarea id="eDecision" rows="3" required>${esc(d.decision||'')}</textarea></label><label class="field"><span>Razón y evidencia</span><textarea id="eReason" rows="4" required>${esc(d.reason||'')}</textarea></label><div class="form-grid two"><label class="field"><span>Responsable</span><input id="eOwner" value="${esc(d.owner||'CEO')}" required></label><label class="field"><span>Fecha</span><input type="date" id="eDate" value="${esc(d.date||today())}" required></label></div><label class="field"><span>Estado</span><select id="eDecisionStatus"><option value="active" ${d.status==='active'?'selected':''}>Vigente</option><option value="superseded" ${d.status==='superseded'?'selected':''}>Superada</option><option value="reversed" ${d.status==='reversed'?'selected':''}>Revertida</option></select></label>`}
    function openEntity(type,id=null){
      state.editing={type,id};let item=null,title='',eyebrow='Registrar';
      if(type==='task'){item=state.tasks.find(x=>x.id===id)||{};title=id?'Editar tarea':'Nueva tarea';document.getElementById('entityFields').innerHTML=taskFields(item)}
      if(type==='goal'){item=state.goals.find(x=>x.id===id)||{};title=id?'Editar objetivo':'Nuevo objetivo';document.getElementById('entityFields').innerHTML=goalFields(item)}
      if(type==='risk'){item=state.risks.find(x=>x.id===id)||{};title=id?'Editar riesgo':'Nuevo riesgo';document.getElementById('entityFields').innerHTML=riskFields(item)}
      if(type==='decision'){item=state.decisions.find(x=>x.id===id)||{};title=id?'Editar decisión':'Nueva decisión';document.getElementById('entityFields').innerHTML=decisionFields(item)}
      if(type==='company'){title='Editar norte estratégico';eyebrow='Dirección CEO';document.getElementById('entityFields').innerHTML=companyFields()}
      document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogEyebrow').textContent=eyebrow;document.getElementById('saveEntity').textContent=id||type==='company'?'Guardar cambios':'Crear';document.getElementById('deleteEntity').hidden=!id||type==='company';dialog.showModal();
    }
    function saveEntity(){
      const {type,id}=state.editing||{};const n=now();
      if(type==='company'){state.company={vision:document.getElementById('eVision').value.trim(),pilotCity:document.getElementById('ePilot').value.trim(),segment:document.getElementById('eSegment').value.trim(),northStar:document.getElementById('eNorth').value.trim(),commission:document.getElementById('eCommission').value.trim()};log('Norte estratégico de NIDO actualizado.');}
      if(type==='task'){const d={title:document.getElementById('eTitle').value.trim(),description:document.getElementById('eDescription').value.trim(),phaseId:document.getElementById('ePhase').value,owner:document.getElementById('eOwner').value.trim(),priority:document.getElementById('ePriority').value,status:document.getElementById('eStatus').value,dueDate:document.getElementById('eDue').value,updatedAt:n};if(id){state.tasks=state.tasks.map(t=>t.id===id?{...t,...d}:t);log(`Tarea “${d.title}” actualizada.`)}else{state.tasks.push({...d,id:uid(),createdAt:n});log(`Tarea “${d.title}” creada.`)}}
      if(type==='goal'){const lines=document.getElementById('eKrs').value.split('\n').map(s=>s.trim()).filter(Boolean),old=state.goals.find(g=>g.id===id);const d={title:document.getElementById('eTitle').value.trim(),period:document.getElementById('ePeriod').value.trim(),why:document.getElementById('eWhy').value.trim(),krs:lines.map((title,i)=>({id:old?.krs?.[i]?.id||uid(),title,progress:old?.krs?.[i]?.progress||0}))};if(id)state.goals=state.goals.map(g=>g.id===id?{...g,...d}:g);else state.goals.push({...d,id:uid()});log(`Objetivo “${d.title}” ${id?'actualizado':'creado'}.`)}
      if(type==='risk'){const d={title:document.getElementById('eTitle').value.trim(),category:document.getElementById('eCategory').value.trim(),owner:document.getElementById('eOwner').value.trim(),probability:clamp(document.getElementById('eProbability').value,1,5),impact:clamp(document.getElementById('eImpact').value,1,5),mitigation:document.getElementById('eMitigation').value.trim(),status:document.getElementById('eRiskStatus').value};if(id)state.risks=state.risks.map(r=>r.id===id?{...r,...d}:r);else state.risks.push({...d,id:uid()});log(`Riesgo “${d.title}” ${id?'actualizado':'creado'}.`)}
      if(type==='decision'){const d={decision:document.getElementById('eDecision').value.trim(),reason:document.getElementById('eReason').value.trim(),owner:document.getElementById('eOwner').value.trim(),date:document.getElementById('eDate').value,status:document.getElementById('eDecisionStatus').value};if(id)state.decisions=state.decisions.map(x=>x.id===id?{...x,...d}:x);else state.decisions.unshift({...d,id:uid()});log(`Decisión ejecutiva ${id?'actualizada':'registrada'}.`)}
      persist();dialog.close();render();toast('Cambios guardados correctamente.');
    }
    function deleteEntity(){const {type,id}=state.editing||{};if(!id||!confirm('¿Eliminar este registro? Esta acción no se puede deshacer.'))return;if(type==='task')state.tasks=state.tasks.filter(x=>x.id!==id);if(type==='goal')state.goals=state.goals.filter(x=>x.id!==id);if(type==='risk')state.risks=state.risks.filter(x=>x.id!==id);if(type==='decision')state.decisions=state.decisions.filter(x=>x.id!==id);log('Registro eliminado.');persist();dialog.close();render();toast('Registro eliminado.')}

    document.addEventListener('click',e=>{
      const b=e.target.closest('button,[data-action]');if(!b)return;
      if(b.dataset.view){state.view=b.dataset.view;document.getElementById('sidebar').classList.remove('open');render();scrollTo({top:0,behavior:'smooth'});return}
      const action=b.dataset.action;
      if(action==='new')openEntity(b.dataset.type||'task');
      if(action==='edit')openEntity(b.dataset.type,b.dataset.id);
      if(action==='edit-company')openEntity('company');
      if(action==='close')dialog.close();
      if(action==='export')exportData();
      if(action==='import')document.getElementById('importInput').click();
      if(action==='toggle-phase'){const ps=phaseState(b.dataset.id);ps.open=!ps.open;persist();render()}
      if(action==='cycle-status'){const t=state.tasks.find(x=>x.id===b.dataset.id);if(t)cycleTask(t)}
      if(action==='approve-phase')approvePhase(b.dataset.id);
      if(action==='kr-minus')updateKR(b.dataset.goal,b.dataset.id,-10);
      if(action==='kr-plus')updateKR(b.dataset.goal,b.dataset.id,10);
      if(action==='risk-next'){const r=state.risks.find(x=>x.id===b.dataset.id),order=['open','watching','mitigated','closed'];if(r){r.status=order[(order.indexOf(r.status)+1)%order.length];log(`Riesgo “${r.title}” cambió a ${riskStatusLabels[r.status]}.`);persist();render();toast('Estado del riesgo actualizado.')}}
      if(b.dataset.rating){state.rating=Number(b.dataset.rating);document.querySelectorAll('[data-rating]').forEach(x=>x.classList.toggle('active',Number(x.dataset.rating)===state.rating))}
    });
    document.addEventListener('change',e=>{
      if(e.target.dataset.action==='set-status')setTaskStatus(e.target.dataset.id,e.target.value);
      if(e.target.id==='phaseFilter'){state.phaseFilter=e.target.value;renderExecution()}
      if(e.target.id==='statusFilter'){state.statusFilter=e.target.value;renderExecution()}
    });
    app.addEventListener('input',e=>{if(e.target.id==='searchInput'){state.search=e.target.value;renderExecution();const input=document.getElementById('searchInput');input.focus();input.setSelectionRange(state.search.length,state.search.length)}});
    document.getElementById('entityForm').addEventListener('submit',e=>{e.preventDefault();saveEntity()});
    document.getElementById('deleteEntity').addEventListener('click',deleteEntity);
    document.getElementById('themeButton').addEventListener('click',()=>{state.theme=state.theme==='light'?'dark':'light';document.documentElement.dataset.theme=state.theme;document.getElementById('themeButton').textContent=state.theme==='light'?'◐':'○';persist()});document.getElementById('themeButton').textContent=state.theme==='light'?'◐':'○';
    document.getElementById('menuButton').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
    document.getElementById('importInput').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(!Array.isArray(d.tasks)||!Array.isArray(d.phases))throw Error();state={...baseState(),...d,view:'dashboard',editing:null};persist();render();toast('Respaldo restaurado correctamente.')}catch(err){toast('El archivo no contiene un respaldo válido de NIDO OS.')}e.target.value=''});
    app.addEventListener('submit',e=>{if(e.target.id!=='reviewForm')return;e.preventDefault();const wins=document.getElementById('rWins').value.trim(),blocks=document.getElementById('rBlocks').value.trim(),learning=document.getElementById('rLearn').value.trim(),focus=document.getElementById('rFocus').value.trim(),decision=document.getElementById('rDecision').value.trim();if(!wins||!learning||!focus){toast('Completa resultado, aprendizaje y próxima prioridad.');return}state.reviews.unshift({id:uid(),date:now(),wins,blocks,learning,focus,decision,rating:state.rating});log(`Revisión CEO guardada. Próximo foco: ${focus}`,'review');persist();render();toast('Revisión ejecutiva guardada.')});
    dialog.addEventListener('click',e=>{const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()});
    document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openEntity('task')}});
    render();
  })();
  </script>
</body>
</html>
